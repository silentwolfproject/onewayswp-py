name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/onewayswp
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify binaries
        shell: bash
        run: |
          echo "=== Verifying binaries ==="
          MISSING=0

          declare -a PATHS=(
            "onewayswp/lib/windows-x64/onewayswp_core.dll"
            "onewayswp/lib/windows-arm64/onewayswp_core.dll"
            "onewayswp/lib/linux-x64/libonewayswp_core.so"
            "onewayswp/lib/linux-arm64/libonewayswp_core.so"
            "onewayswp/lib/linux-armv7/libonewayswp_core.so"
            "onewayswp/lib/macos-x64/libonewayswp_core.dylib"
            "onewayswp/lib/macos-arm64/libonewayswp_core.dylib"
            "onewayswp/lib/android-arm64/libonewayswp_core.so"
            "onewayswp/lib/android-armv7/libonewayswp_core.so"
            "onewayswp/lib/android-x64/libonewayswp_core.so"
            "onewayswp/lib/android-x86/libonewayswp_core.so"
          )

          for P in "${PATHS[@]}"; do
            if [ -f "$P" ]; then
              SIZE=$(stat -c%s "$P" 2>/dev/null || stat -f%z "$P")
              echo "OK  $P ($SIZE bytes)"
            else
              echo "MISSING  $P"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING binary file(s) missing"
            exit 1
          fi

          echo ""
          echo "All binaries present"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel
        run: python -m build

      - name: Check wheel contents
        shell: bash
        run: |
          echo "=== Wheel contents ==="
          unzip -l dist/*.whl
          echo ""
          echo "=== Checking binaries in wheel ==="
          BIN_COUNT=$(unzip -l dist/*.whl | grep -E "\.(so|dll|dylib)$" | wc -l)
          echo "Binaries found: $BIN_COUNT"
          if [ "$BIN_COUNT" -lt 11 ]; then
            echo "ERROR: Expected at least 11 binaries, got $BIN_COUNT"
            exit 1
          fi

      - name: Check package metadata
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true